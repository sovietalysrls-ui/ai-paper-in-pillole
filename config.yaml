# =====================================================================
#  AI Paper in Pillole - impostazioni
#  Questo è l'unico file da toccare per cambiare il comportamento.
#  Le righe che iniziano con # sono commenti: il programma le ignora.
# =====================================================================

# Lingue da produrre ogni notte, nell'ordine.
# Oggi solo italiano. Per avere anche l'inglese:  lingue: [it, en]
# Con più lingue, la cartella OGGI avrà una sottocartella per lingua.
lingue: [it]

# Dove finiscono i file. ~ significa la tua cartella home.
cartella_base: ~/AI-Paper-in-Pillole

# Numero della prima puntata prodotta da questo sistema.
# Serve solo la prima volta: dopo, il numero lo tiene il registro.
numero_iniziale:
  it: 50
  en: 1

# ---------------------------------------------------------------------
#  Motori: chi fa cosa
#    testo:     ollama (locale) | gemini (cloud)
#    voce:      gemini (cloud) | nessuna   (la voce locale arriva dopo)
#    copertina: disegno (generata dal programma, nessun servizio)
# ---------------------------------------------------------------------
motori:
  testo: ollama
  voce: nessuna
  copertina: disegno

# ---------------------------------------------------------------------
#  Scelta del paper
# ---------------------------------------------------------------------
scelta:
  # Quanti giorni indietro cercare una lista di Hugging Face non vuota.
  giorni_indietro: 7
  # Si parte dalla lista di ieri: alle 4 di notte quella di oggi
  # è appena nata e i voti non sono ancora significativi.
  parti_da_ieri: true
  # Voti minimi per considerare un paper (0 = nessun limite).
  voti_minimi: 5

# ---------------------------------------------------------------------
#  Lettura del paper
# ---------------------------------------------------------------------
lettura:
  # Parole massime prese da ogni sezione utile.
  parole_max_sezione: 2500
  # Dimensione dei pezzi dati al modello, in parole.
  parole_per_pezzo: 1800
  # true = più sezioni nello stesso pezzo (per i modelli cloud).
  unisci_sezioni: false
  # Didascalie di figure e tabelle da tenere (le prime N).
  didascalie_max: 12

# ---------------------------------------------------------------------
#  Modello di testo locale (Ollama)
# ---------------------------------------------------------------------
modello_testo:
  indirizzo: http://127.0.0.1:11434
  nome: qwen3.5:9b
  # Memoria di lavoro del modello, in "token" (pezzi di parola).
  # 16384 sta comodo in 8 GB con Qwen3.5-9B.
  contesto: 16384
  temperatura_fatti: 0.2      # bassa: estrazione precisa
  temperatura_scrittura: 0.7  # più alta: dialogo più vivo
  # Spegne il "ragionamento ad alta voce" dei modelli Qwen3.x:
  # più veloce e più adatto alla scrittura.
  disattiva_ragionamento: true
  # Secondi massimi per una singola risposta.
  timeout: 900

# ---------------------------------------------------------------------
#  Gemini, testo (cloud)
#  Chiavi in segreti.env: GEMINI_API_KEY_GRATIS, poi GEMINI_API_KEY_PAGAMENTO.
#  La seconda si usa solo se la prima esaurisce la quota del giorno.
# ---------------------------------------------------------------------
gemini_testo:
  modello: gemini-3.8-flash
  temperatura_fatti: 0.2
  temperatura_scrittura: 0.7
  # Secondi di attesa tra una richiesta e l'altra: il livello
  # gratuito ha un limite di richieste al minuto.
  pausa_tra_richieste: 8
  # auto = prova la porta nuova (interactions), se manca usa la vecchia.
  porta: auto

# ---------------------------------------------------------------------
#  Gemini, voce (cloud)
# ---------------------------------------------------------------------
gemini_voce:
  modello: gemini-3.8-flash-tts
  # Voci predefinite di Gemini. Altre possibili: Charon, Fenrir, Orus
  # (maschili), Kore, Leda, Aoede, Erinome (femminili).
  voci:
    CARLO: Puck
    ARIANNA: Aoede
  stili:
    CARLO: "tono caldo, curioso e un po' ironico, ritmo costante e naturale"
    ARIANNA: "tono chiaro e sorridente, spiega con calma, ritmo costante e naturale"
  # Istruzione generale (usata con la porta vecchia generateContent).
  istruzioni: >-
    Leggi questo dialogo in italiano, come una conversazione naturale tra
    due amici in un podcast. Ritmo costante, niente esitazioni.
    Pronuncia i nomi inglesi all'inglese.
  # Battute per richiesta: meno richieste = meno quota usata.
  battute_per_blocco: 14
  pausa_tra_richieste: 10
  porta: auto

# ---------------------------------------------------------------------
#  Montaggio audio
# ---------------------------------------------------------------------
audio:
  sigla_apertura: assets/sigla_apertura.wav
  sigla_chiusura: assets/sigla_chiusura.wav
  volume_sigla: 0.5
  # Secondi in cui la sigla sfuma sotto la presentazione.
  sovrapposizione_sigla: 2.5
  pausa_tra_blocchi: 0.35
  lufs: -16
  mp3_bitrate: 128k

# ---------------------------------------------------------------------
#  Copertina
# ---------------------------------------------------------------------
copertina:
  lato: 1400
  colori:
    fondo: "#F2E8D5"       # crema
    principale: "#6E1E2B"  # bordeaux
    linee: "#2B2B2E"       # grigio scuro
    sfondo2: "#E3D3B8"     # crema scuro
    accento: "#C9A15B"     # ocra

# ---------------------------------------------------------------------
#  Dialogo
# ---------------------------------------------------------------------
dialogo:
  # Durata massima della puntata, sigle escluse.
  secondi_max: 285
  # Velocità di lettura stimata della voce sintetica.
  # Si corregge dopo le prime puntate misurando l'audio vero.
  parole_al_minuto: 155
  # Sotto questa quota il dialogo è troppo magro.
  parole_min: 520
  # Giri massimi di correzione automatica.
  giri_correzione: 3
  # Parole massime in una singola frase prima di farla spezzare.
  parole_max_frase: 28
  # true = tutte le battute da correggere in una sola richiesta (cloud).
  correzione_in_blocco: false

# ---------------------------------------------------------------------
#  Articolo sul sito
# ---------------------------------------------------------------------
articolo:
  parole_min: 650
  parole_max: 950
  link_podcast: https://open.spotify.com/show/0343HceLfMtVbfln7gVijy

# ---------------------------------------------------------------------
#  WordPress
#  Utente e password per applicazioni stanno in segreti.env.
# ---------------------------------------------------------------------
wordpress:
  attivo: true
  sito: https://andreamanini.it
  # bozza  = lo trovi in bozza e premi "Pubblica" tu
  # pubblica = esce da solo
  stato: bozza
  categoria: AI Paper in Pillole
  # Lingue che vanno sul sito (il sito è in italiano).
  lingue: [it]

# ---------------------------------------------------------------------
#  Memoria video
#  Il programma misura il picco di memoria usata dalla scheda video.
#  Se supera questo limite, avvisa: sulla GTX 1070 (8 GB) non starebbe.
#  7500 MB = 8 GB meno lo spazio che occupa il desktop.
# ---------------------------------------------------------------------
gpu:
  limite_vram_mb: 7500

# ---------------------------------------------------------------------
#  Avvisi e consegna su Telegram
#  Il codice del bot e il numero della chat stanno in segreti.env.
# ---------------------------------------------------------------------
telegram:
  attivo: true
  # true = la mattina il bot ti manda titolo, descrizione, copertina,
  # mp3 e wav, pronti da caricare su Spotify.
  manda_file: true

# =====================================================================
#  Profilo CLOUD: si attiva con  python pipeline.py --cloud
#  Sostituisce solo le voci elencate qui sotto.
# =====================================================================
profilo_cloud:
  cartella_base: ./uscita
  # Cartella del repository dove salvare testi e registro di ogni
  # puntata (senza audio), così il registro sopravvive tra una notte
  # e l'altra anche nel cloud.
  archivio_git: archivio
  motori:
    testo: gemini
    voce: gemini
    copertina: disegno
  lettura:
    parole_per_pezzo: 15000
    unisci_sezioni: true
  dialogo:
    correzione_in_blocco: true
