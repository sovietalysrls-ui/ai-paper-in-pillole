# Sigla con Lyria. Si lancia a mano: Actions > Sigla > Run workflow.
#   proponi: crea proposte e le manda su Telegram
#   usa:     ricava apertura e chiusura dalla proposta scelta
name: Sigla

on:
  workflow_dispatch:
    inputs:
      azione:
        description: "Cosa fare"
        type: choice
        options: [proponi, usa]
        default: proponi
      numero:
        description: "Solo per 'usa': il numero della proposta scelta"
        required: false
        default: ""
      stile:
        description: "Solo per 'proponi': uno stile tuo (vuoto = 6 stili diversi)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sigla:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa programmi
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          pip install -q -r requirements.txt
      - name: Esegui
        env:
          GEMINI_API_KEY_GRATIS: ${{ secrets.GEMINI_API_KEY_GRATIS }}
          GEMINI_API_KEY_PAGAMENTO: ${{ secrets.GEMINI_API_KEY_PAGAMENTO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.azione }}" = "usa" ]; then
            python musica.py usa ${{ inputs.numero }}
          elif [ -n "${{ inputs.stile }}" ]; then
            python musica.py proponi --stile "${{ inputs.stile }}"
          else
            python musica.py proponi
          fi
      - name: Salva nel repository
        if: always()
        run: |
          git config user.name "AI Paper in Pillole"
          git config user.email "actions@users.noreply.github.com"
          git add -f assets/proposte assets/sigla_apertura.wav assets/sigla_chiusura.wav 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Sigla: ${{ inputs.azione }} ${{ inputs.numero }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
