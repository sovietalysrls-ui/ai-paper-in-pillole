name: Controlli codice

on:
  push:
    paths:
      - "*.py"
      - "kit/**"
      - "tests/**"
      - "config.yaml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "*.py"
      - "kit/**"
      - "tests/**"
      - "config.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Controlla sintassi e test
        run: |
          python -m py_compile pipeline.py pubblica_articolo.py kit/*.py
          python -m unittest discover -s tests -v
