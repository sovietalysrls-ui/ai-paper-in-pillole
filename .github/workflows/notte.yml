# La notte di AI Paper in Pillole, sui computer di GitHub.
#
# Parte da sola ogni notte. Si può anche lanciare a mano:
# scheda "Actions" del repository > "Notte" > "Run workflow".
#
# I segreti (chiavi Gemini, bot Telegram, WordPress) si impostano in
# Settings > Secrets and variables > Actions. Non stanno mai nel codice.

name: Notte

on:
  schedule:
    # 02:15 UTC = 04:15 in Italia con l'ora legale, 03:15 con l'ora solare.
    # GitHub a volte salta una partenza quando i suoi server sono carichi.
    # Per questo ci sono altre due sveglie di riserva, un'ora e due ore dopo:
    # se la puntata del giorno è già fatta, escono subito senza fare nulla.
    - cron: "15 2 * * *"
    - cron: "17 3 * * *"
    - cron: "19 4 * * *"
  workflow_dispatch:
    inputs:
      paper:
        description: "Forza un paper arXiv (es. 2610.01762). Vuoto = il più votato"
        required: false
        default: ""
      prova:
        description: "Prova: registro e archivio separati, numerazione vera intatta"
        type: boolean
        default: false
      voce:
        description: "Motore voce"
        type: choice
        options: [gemini, nessuna]
        default: gemini
      sostituisci:
        description: "Con 'paper': rifà una puntata già uscita, stesso numero, e aggiorna articolo, Drive e Releases"
        type: boolean
        default: false
      se_manca:
        description: "Esci subito se la puntata di oggi è già fatta (per le sveglie esterne)"
        type: boolean
        default: false
      solo_testi:
        description: "Solo dialogo e articolo: niente voce, copertina disegnata (per rivederli)"
        type: boolean
        default: false
      solo_articolo:
        description: "Non rifare la puntata: pubblica solo l'articolo dell'ultima puntata archiviata"
        type: boolean
        default: false
      riprendi_da:
        description: "Riprendi dai file salvati di un'esecuzione interrotta (numero nell'indirizzo della pagina)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: notte
  cancel-in-progress: false

jobs:
  puntata:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      wp_ok: ${{ steps.wp.outputs.ok }}
    steps:
      # Sempre l'ultima versione di main: una notte in coda deve vedere il registro
      # aggiornato dalla notte prima di lei, altrimenti farebbe una puntata doppia.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Ogni esecuzione parte su un computer pulito. Per riprendere davvero,
      # ricarica OGGI e .lavoro dall'artifact salvato dal tentativo interrotto.
      - name: Recupera il punto di interruzione
        if: ${{ inputs.riprendi_da != '' }}
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ inputs.riprendi_da }}
          github-token: ${{ github.token }}
          pattern: puntata-*
          path: .
          merge-multiple: true

      - name: Controlla il punto di interruzione
        if: ${{ inputs.riprendi_da != '' }}
        run: |
          test -f uscita/OGGI/.lavoro/stato.json || {
            echo "::error::L'esecuzione indicata non contiene un punto di ripresa valido"
            exit 1
          }

      - name: Installa programmi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Prepara la puntata
        env:
          TZ: Europe/Rome
          GEMINI_API_KEY_GRATIS: ${{ secrets.GEMINI_API_KEY_GRATIS }}
          GEMINI_API_KEY_PAGAMENTO: ${{ secrets.GEMINI_API_KEY_PAGAMENTO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WP_UTENTE: ${{ secrets.WP_UTENTE }}
          WP_PASSWORD_APP: ${{ secrets.WP_PASSWORD_APP }}
          PAPER: ${{ inputs.paper }}
        run: |
          if [ "${{ inputs.solo_articolo }}" = "true" ]; then
            python pubblica_articolo.py ultima || true
            exit 0
          fi
          ARGS=(--cloud)
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.se_manca }}" = "true" ]; then ARGS+=(--se-manca); fi
          if [ -n "$PAPER" ]; then
            if [[ ! "$PAPER" =~ ^[0-9]{4}\.[0-9]{4,5}(v[0-9]+)?$ ]]; then
              echo "::error::ID arXiv non valido: usa per esempio 2610.01762"
              exit 2
            fi
            ARGS+=(--paper "$PAPER")
          fi
          if [ "${{ inputs.prova }}" = "true" ]; then ARGS+=(--prova); fi
          if [ "${{ inputs.sostituisci }}" = "true" ]; then ARGS+=(--sostituisci); fi
          if [ "${{ inputs.solo_testi }}" = "true" ]; then ARGS+=(--solo-testi); fi
          if [ -n "${{ inputs.voce }}" ]; then ARGS+=(--voce "${{ inputs.voce }}"); fi
          # Un secondo passaggio usa gli stessi file in .lavoro: ripete soltanto
          # il passo fallito (per esempio un singolo turno vocale o una chiamata
          # temporaneamente indisponibile), senza duplicare quelli già conclusi.
          for TENTATIVO in 1 2; do
            if python pipeline.py "${ARGS[@]}"; then
              exit 0
            fi
            if [ "$TENTATIVO" -lt 2 ]; then
              echo "::warning::Tentativo interrotto; riprendo dallo stesso punto tra 2 minuti"
              sleep 120
            fi
          done
          exit 1

      - name: L'articolo è andato sul sito?
        id: wp
        if: always()
        run: |
          ULTIMA=$(ls -d archivio/puntate/*/ 2>/dev/null | tail -1)
          if ls uscita/OGGI/.lavoro/*/wordpress.json >/dev/null 2>&1 || [ -f "${ULTIMA}wordpress.json" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copia su Google Drive
        if: ${{ success() && inputs.prova != true && inputs.solo_articolo != true }}
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -f uscita/OGGI/puntata.wav ] || { echo "Nessuna puntata nuova da copiare"; exit 0; }
          if [ -z "$RCLONE_CONF" ]; then echo "Google Drive non configurato (segreto RCLONE_CONF)"; exit 0; fi
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          if ./drive.sh uscita/OGGI; then
            ./avvisa.sh "📁 Puntata copiata su Google Drive (cartella AI PAPER IN PILLOLE / OGGI). La precedente è in OLD, senza wav."
          else
            ./avvisa.sh "⚠️ Copia su Google Drive non riuscita. I file restano su Telegram e su GitHub."
          fi

      - name: Salva i file della puntata (14 giorni)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: puntata-${{ github.run_number }}
          path: |
            uscita*/OGGI/*
            uscita*/OGGI/.lavoro/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      - name: Archivia testi e registro nel repository
        if: always()
        run: |
          git config user.name "AI Paper in Pillole"
          git config user.email "actions@users.noreply.github.com"
          for d in archivio archivio-PROVA; do
            if [ -d "$d" ]; then git add -f "$d"; fi
          done
          if git diff --cached --quiet; then
            echo "Niente da archiviare"
            exit 0
          fi
          git commit -m "Archivio: puntata del $(TZ=Europe/Rome date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && break
            sleep 5
          done

      # Il wav è troppo pesante per il repository: va nelle Releases
      # (colonna di destra della pagina del repository), insieme all'mp3.
      - name: Audio nelle Releases
        if: ${{ success() && inputs.prova != true && inputs.solo_articolo != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -f uscita/OGGI/puntata.wav ] || { echo "Nessun audio oggi"; exit 0; }
          CARTELLA=$(ls -d archivio/puntate/*/ | sort | tail -1)
          NOME=$(basename "$CARTELLA")
          if gh release view "$NOME" >/dev/null 2>&1; then
            if [ "${{ inputs.sostituisci }}" = "true" ]; then
              gh release upload "$NOME" uscita/OGGI/puntata.wav uscita/OGGI/puntata.mp3 uscita/OGGI/copertina.jpg --clobber \
                && ./avvisa.sh "🗄 Audio sostituito su GitHub: https://github.com/${{ github.repository }}/releases/tag/$NOME"
            else
              echo "Release già presente"
            fi
            exit 0
          fi
          gh release create "$NOME" uscita/OGGI/puntata.wav uscita/OGGI/puntata.mp3 uscita/OGGI/copertina.jpg \
            --title "$(head -1 uscita/OGGI/titolo_e_descrizione.txt)" --notes "$(tail -n +3 uscita/OGGI/titolo_e_descrizione.txt)" \
            && ./avvisa.sh "🗄 Audio archiviato su GitHub: https://github.com/${{ github.repository }}/releases/tag/$NOME" \
            || ./avvisa.sh "⚠️ Audio non archiviato nelle Releases di GitHub."

  # Il server del sito blocca alcuni server di GitHub. Ogni lavoro parte su un
  # server diverso: se il caricamento dell'articolo non è riuscito, si riprova
  # da qui, fino a due volte.
  articolo_2:
    needs: puntata
    if: ${{ always() && needs.puntata.outputs.wp_ok != 'true' && inputs.prova != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Aspetta 15 minuti
        run: sleep 900
      - name: Pubblica l'articolo (tentativo 2)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WP_UTENTE: ${{ secrets.WP_UTENTE }}
          WP_PASSWORD_APP: ${{ secrets.WP_PASSWORD_APP }}
        run: python pubblica_articolo.py ultima --tentativo 2 ${{ inputs.sostituisci && '--sostituisci' || '' }}
      - name: Archivia l'esito
        run: |
          git config user.name "AI Paper in Pillole"
          git config user.email "actions@users.noreply.github.com"
          git add -f archivio && git commit -q -m "Archivio: articolo pubblicato" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

  articolo_3:
    needs: [puntata, articolo_2]
    if: ${{ always() && needs.puntata.outputs.wp_ok != 'true' && needs.articolo_2.result == 'failure' && inputs.prova != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Aspetta 15 minuti
        run: sleep 900
      - name: Pubblica l'articolo (tentativo 3, ultimo)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WP_UTENTE: ${{ secrets.WP_UTENTE }}
          WP_PASSWORD_APP: ${{ secrets.WP_PASSWORD_APP }}
        run: python pubblica_articolo.py ultima --tentativo 3 --ultimo ${{ inputs.sostituisci && '--sostituisci' || '' }}
      - name: Archivia l'esito
        run: |
          git config user.name "AI Paper in Pillole"
          git config user.email "actions@users.noreply.github.com"
          git add -f archivio && git commit -q -m "Archivio: articolo pubblicato" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
