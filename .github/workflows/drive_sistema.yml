# Una volta sola: sposta OGGI e OLD dalla cartella creata dal programma
# ("AI Paper in Pillole") a quella che esisteva già su Drive ("AI PAPER IN PILLOLE").
# Non cancella nessun file: toglie solo la cartella rimasta vuota.

name: Drive - sistema cartelle

on:
  workflow_dispatch:

jobs:
  sistema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Sistema
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          NUOVA="gdrive:AI Paper in Pillole"
          VERA="gdrive:AI PAPER IN PILLOLE"
          rclone move "$NUOVA/OGGI" "$VERA/OGGI" -v
          rclone move "$NUOVA/OLD" "$VERA/OLD" -v
          rclone rmdirs "$NUOVA" -v || true
          echo "--- Come è adesso ---"
          rclone tree "$VERA" --exclude "Credenziali/**"
